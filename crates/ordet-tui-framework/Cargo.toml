[package]
name = "ordet-tui-framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight, event-driven TUI framework with coalescing ANSI diff rendering, explicit layout, keymaps, focus, and a background task pool"
readme = "README.md"
keywords = ["tui", "terminal", "ui", "ansi", "framework"]
categories = ["command-line-interface", "gui"]

[dependencies]
crossterm = "0.29"
unicode-segmentation = "1.12"
unicode-width = "0.2"
crossbeam-channel = "0.5"
