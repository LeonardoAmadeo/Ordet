[package]
name = "ordet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal-first Ordet word processor binary"
readme = "../../README.md"

[[bin]]
name = "ordet"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
dirs = "5"
dunce = "1"
ordet-format = { path = "../ordet-format" }
ordet-tui-framework = { path = "../ordet-tui-framework" }
regex = "1.12"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.36", features = ["local-offset"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
urlencoding = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
ctrlc = "3"
winreg = "0.55"
